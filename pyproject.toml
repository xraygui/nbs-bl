[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nbs-bl"
authors = [
    {name = "Charles Titus", email = "ctitus@bnl.gov"},
]
requires-python = ">=3.9"
description = "NBS Beamline Framework"
dynamic = ["version"]
readme = "README.md"
keywords = ["bluesky", "nsls-ii", "beamline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research"
]
dependencies = ["bluesky",
    "bluesky-queueserver",
    "databroker>=2.0.0b67",
    "ophyd",
    "numpy",
    "ipython",
    "redis_json_dict",
    "numpydoc",
    "nbs-core>=0.1",
    'tomli ; python_version < "3.11"']

[project.urls]
homepage = "https://github.com/xraygui/nbs-bl"

[tool.hatch.version]
source = "vcs"

[project.entry-points."nbs_bl.plan_loaders"]
xas = "nbs_bl.plans.xas:load_xas"

[project.scripts]
nbs-bl-config-editor = "nbs_bl.qt.widgets.config_editor:main"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
nbs-bl = { path = ".", editable = true }

[tool.pixi.feature.build.dependencies]
hatch = "*"

[tool.pixi.feature.build.tasks]
build = "hatch build"

[tool.pixi.feature.gui.dependencies]
qtpy = "*"
pyqt = "*"

[tool.pixi.feature.gui.tasks]
config-editor = "nbs-bl-config-editor"
roundtrip-devices = "python -c \"from nbs_bl.qt.models.config_model import ConfigModel; m=ConfigModel(); m.load_from_file('/home/jamie/work/xraygui/ucal-pods/src/ucal_pods/config/ipython/profile_default/startup/devices.toml'); txt=m.dumps(); import tempfile, pathlib; p=pathlib.Path(tempfile.gettempdir())/'devices_roundtrip.toml'; p.write_text(txt, encoding='utf-8'); m2=ConfigModel(); m2.load_from_file(p); assert set(m.devices.keys())==set(m2.devices.keys()); print('roundtrip_ok', len(m.devices))\""

[tool.pixi.environments]
build = { features = ["build"], solve-group = "default" }
gui = { features = ["gui"], solve-group = "default" }